services:
  database:
    container_name: "postgres-dev"
    image: "postgres:latest"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"
  mailcatcher:
    container_name: "mailcatcher-dev"
    image: "sj26/mailcatcher:v0.10.0"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:1080:1080"
